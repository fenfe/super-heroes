<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heroes</title>
    <style>
        form{display: flex;flex-direction: column;gap: 16px;width: 500px;}
       .inputs{padding: 8px;}
    </style>
</head>
<body>
    <form action="http://localhost:3000/addHero" method="POST" target="" >
        <h1>create a hero</h1>
        <input class="inputs" type="text" name="heroName" placeholder="Hero Name (e.g. Spider-Man)" required>
        <input class="inputs" type="text" name="alterEgo" placeholder="Real Name / Alter Ego (e.g. Peter Parker)">
        <input class="inputs" type="text" name="powers" placeholder="Powers (e.g. Web-slinging, Wall-crawling)">
        <input class="inputs" type="text" name="movie" placeholder="Debut Movie">
        <button class="inputs" type="submit" class="btn-create">CREATE Hero</button>
    </form> <br><br>
    <form action="http://localhost:3000/updateHero" method="POST" target="">
        <h1>update a hero</h1>
        <input class="inputs" type="number" name="id" placeholder="4" required>
        <input class="inputs" type="text" name="heroName" placeholder="Hero Name (e.g. Spider-Man)" required>
        <input class="inputs" type="text" name="alterEgo" placeholder="Real Name / Alter Ego (e.g. Peter Parker)">
        <input class="inputs" type="text" name="powers" placeholder="Powers (e.g. Web-slinging, Wall-crawling)">
        <input class="inputs" type="text" name="movie" placeholder="Debut Movie">
        <button class="inputs" type="submit" class="btn-create">update Hero</button>
    </form>
    <br><br>
    <form action="http://localhost:3000/deleteHero" method="POST" target="">
        <h1>delete a hero</h1>
        <input class="inputs" type="number" name="id" placeholder="4" required>
        <button class="inputs" type="submit" class="btn-create">delete Hero</button>
    </form>
</body>
</html>
